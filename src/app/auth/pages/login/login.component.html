<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-tr from-indigo-600 via-purple-500 to-pink-500"
>
  <div
    class="bg-white/90 backdrop-blur-md p-10 rounded-3xl shadow-2xl w-full max-w-md mx-4 animate-fade-in"
  >
    <!-- Logo & Nombre del sistema -->
    <div class="flex flex-col items-center mb-6">
      <div
        class="bg-purple-600 rounded-full w-16 h-16 flex items-center justify-center shadow-md mb-3"
      >
        <span class="text-white text-2xl font-bold">🚑</span>
      </div>
      <h1 class="text-3xl font-extrabold text-purple-700">AMBUCOTROL</h1>
      <p class="text-sm text-gray-500 mt-1">Emergency Dispatch System</p>
    </div>

    <!-- Formulario de login -->
    <form (ngSubmit)="onSubmit()" [formGroup]="loginForm" class="space-y-5">
      <div>
        <label class="block text-gray-700 mb-1">Username</label>
        <input
          type="text"
          formControlName="username"
          placeholder="Enter your username"
          class="w-full px-4 py-3 border border-purple-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400 transition"
        />
      </div>

      <div>
        <label class="block text-gray-700 mb-1">Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full px-4 py-3 border border-purple-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400 transition"
        />
      </div>

      <!-- Botón de Login -->
      <button
        type="submit"
        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl shadow-md transition duration-300"
      >
        Login
      </button>
    </form>
    <!-- BOTÓN GOOGLE -->

    <div class="flex justify-center py-2">
      <button
        (click)="loginWithGoogle()"
        class="flex items-center justify-center gap-2 border border-gray-300 rounded-md shadow-sm px-4 py-2 text-sm font-medium text-gray-700 bg-white hover:bg-gray-100"
      >
        <img
          src="https://developers.google.com/identity/images/g-logo.png"
          alt="Google logo"
          class="w-5 h-5"
        />
        Iniciar sesión con Google
      </button>
    </div>
    <!-- Footer -->
    <div class="text-center text-sm text-gray-400 mt-6">
      © 2025 Ambucotrol. All rights reserved.
    </div>
  </div>
</div>
