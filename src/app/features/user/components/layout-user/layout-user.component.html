    <app-header-user></app-header-user>
    <!-- Componente header -->
  </div>

  <!-- Contenedor con sidebar y contenido (flex horizontal) -->

    <div class="w-64 bg-gray-800 text-white p-4">

      <!-- Componente sidebar -->
    </div>
