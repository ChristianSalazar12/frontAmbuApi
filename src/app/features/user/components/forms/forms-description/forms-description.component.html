<form
  (ngSubmit)="onSubmit()"
  #descriptionForm="ngForm"
  class="bg-white rounded-lg grid gap-4 w-full"
>
  <div class="grid gap-4">
    <input
      type="text"
      [(ngModel)]="description.description"
      name="description"
      placeholder="Descripción del evento clínico"
      required
      class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 w-full"
    />

    <select
      [(ngModel)]="description.type_context"
      name="type_context"
      required
      class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 w-full"
    >
      <option value="" disabled selected>Selecciona tipo de contexto</option>
      <option value="CLINICO">CLÍNICO</option>
      <option value="TECNICO">TÉCNICO</option>
      <option value="SOCIAL">SOCIAL</option>
    </select>

    <input
      type="text"
      [(ngModel)]="description.implicados"
      name="implicados"
      placeholder="Implicados (ej: Paramédico, Familiares)"
      required
      class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 w-full"
    />
  </div>

  <button
    type="submit"
    class="self-end mt-4 bg-gradient-to-r from-blue-500 to-blue-700 hover:from-blue-600 hover:to-blue-800 text-white px-6 py-2 rounded shadow font-semibold transition-all"
  >
    Confirmar Descripción
  </button>
</form>
