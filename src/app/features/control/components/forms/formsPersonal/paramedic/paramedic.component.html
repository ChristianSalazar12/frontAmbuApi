<!-- Menú de acciones -->
<div class="mb-4 flex justify-between">
  <div>
    <button
      type="button"
      class="bg-blue-500 text-white px-3 mx-1 py-1 rounded"
      (click)="modo = 'agregar'"
    >
      Agregar
    </button>
    <button
      type="button"
      class="bg-yellow-500 text-white px-3 mx-1 py-1 rounded"
      (click)="modo = 'editar'"
    >
      Editar
    </button>
    <button
      type="button"
      class="bg-red-500 text-white px-3 mx-1 py-1 rounded"
      (click)="modo = 'eliminar'"
    >
      Eliminar
    </button>
  </div>
</div>

<!-- Formulario -->
<form
  class="flex flex-wrap gap-2"
  [formGroup]="formulario"
  (ngSubmit)="ejecutarAccion()"
>
  <input class="border rounded" formControlName="name" placeholder="Nombre" />
  <input
    class="border rounded"
    formControlName="last_name"
    placeholder="Apellido"
  />
  <input
    class="w-32 border rounded"
    formControlName="no_ci_medic"
    placeholder="N° Médico"
  />
  <input
    class="w-28 border rounded"
    formControlName="document"
    placeholder="Documento"
  />
  <input
    class="w-32 border rounded"
    formControlName="tipo_medic"
    placeholder="Tipo Médico"
  />
  <input
    class="border rounded"
    formControlName="id_capacitation"
    placeholder="ID Capacitación"
  />

  <div>
    <button type="submit" class="bg-green-600 text-white px-3 py-1 rounded">
      {{
        modo === "agregar"
          ? "Agregar"
          : modo === "editar"
          ? "Editar"
          : "Eliminar"
      }}
    </button>
  </div>
</form>

<h3 class="mt-6">Listado de Paramédicos</h3>
<div class="overflow-auto max-h-56 border bg-secondary rounded-md">
  <table class="w-full text-left">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>N° Médico</th>
        <th>Documento</th>
        <th>Tipo Médico</th>
        <th>ID Capacitación</th>
        <th>Rol</th>
      </tr>
    </thead>
    <tbody>
      <tr
        class="cursor-pointer hover:bg-blue-300"
        *ngFor="let p of paramedics"
        (click)="seleccionarParamedico(p)"
      >
        <td>{{ p.name }}</td>
        <td>{{ p.last_name }}</td>
        <td>{{ p.no_ci_medic }}</td>
        <td>{{ p.document }}</td>
        <td>{{ p.tipo_medic }}</td>
        <td>{{ p.id_capacitation }}</td>
        <td>{{ p.role }}</td>
      </tr>
    </tbody>
  </table>
</div>
