<!-- Menú de acciones -->
<div class="mb-6 flex gap-3">
  <button
    type="button"
    class="bg-blue-500 hover:bg-blue-600 transition-colors text-white px-4 py-2 rounded shadow flex items-center gap-1"
    [class.opacity-80]="modo === 'agregar'"
    (click)="modo = 'agregar'"
  >
    <svg
      class="w-4 h-4"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 4v16m8-8H4"
      />
    </svg>
    Agregar
  </button>
  <button
    type="button"
    class="bg-yellow-500 hover:bg-yellow-600 transition-colors text-white px-4 py-2 rounded shadow flex items-center gap-1"
    [class.opacity-80]="modo === 'editar'"
    (click)="modo = 'editar'"
  >
    <svg
      class="w-4 h-4"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15.232 5.232l3.536 3.536M9 13l6-6m2 2l-6 6m2 2l-6 6"
      />
    </svg>
    Editar
  </button>
  <button
    type="button"
    class="bg-red-500 hover:bg-red-600 transition-colors text-white px-4 py-2 rounded shadow flex items-center gap-1"
    [class.opacity-80]="modo === 'eliminar'"
    (click)="modo = 'eliminar'"
  >
    <svg
      class="w-4 h-4"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M6 18L18 6M6 6l12 12"
      />
    </svg>
    Eliminar
  </button>
</div>

<!-- Formulario -->
<form
  [formGroup]="formulario"
  (ngSubmit)="ejecutarAccion()"
  class="bg-white p-6 rounded-lg shadow-md flex flex-col gap-4 max-w-xl mx-auto"
>
  <div class="flex gap-4">
    <input
      formControlName="name"
      placeholder="Nombre"
      class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
    />
    <input
      formControlName="last_name"
      placeholder="Apellido"
      class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
    />
  </div>
  <div class="flex gap-4">
    <input
      formControlName="document"
      placeholder="Documento"
      class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
    />
    <input
      formControlName="no_ci_auxiliar"
      placeholder="N° Auxiliar"
      class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
    />
  </div>
  <div class="flex gap-4">
    <input
      formControlName="no_ci_soporte_vital"
      placeholder="N° Soporte Vital"
      class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
    />
  </div>
  <button
    type="submit"
    class="self-end mt-2 bg-gradient-to-r from-blue-500 to-blue-700 hover:from-blue-600 hover:to-blue-800 text-white px-6 py-2 rounded shadow font-semibold transition-all"
  >
    {{
      modo === "agregar" ? "Agregar" : modo === "editar" ? "Editar" : "Eliminar"
    }}
  </button>
</form>

<h3 class="mt-8 mb-2 text-lg font-semibold text-gray-700">
  Listado de Auxiliares
</h3>
<div class="overflow-auto max-h-56 border border-gray-200 bg-gray-50 rounded-lg shadow">
  <table class="w-full text-left">
    <thead class="bg-blue-100">
      <tr>
        <th class="py-2 px-3 font-medium text-gray-700">Nombre</th>
        <th class="py-2 px-3 font-medium text-gray-700">Apellido</th>
        <th class="py-2 px-3 font-medium text-gray-700">Documento</th>
        <th class="py-2 px-3 font-medium text-gray-700">N° Auxiliar</th>
        <th class="py-2 px-3 font-medium text-gray-700">N° Soporte Vital</th>
        <th class="py-2 px-3 font-medium text-gray-700">Rol</th>
      </tr>
    </thead>
    <tbody>
      <tr
        class="cursor-pointer hover:bg-blue-200 transition"
        *ngFor="let p of auxiliares"
        (click)="seleccionarParamedico(p)"
      >
        <td class="py-2 px-3">{{ p.name }}</td>
        <td class="py-2 px-3">{{ p.last_name }}</td>
        <td class="py-2 px-3">{{ p.document }}</td>
        <td class="py-2 px-3">{{ p.no_ci_auxiliar }}</td>
        <td class="py-2 px-3">{{ p.no_ci_soporte_vital }}</td>
        <td class="py-2 px-3">{{ p.role }}</td>
      </tr>
    </tbody>
  </table>
</div>
