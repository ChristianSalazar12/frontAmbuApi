<h2 class="mb-4 text-2xl font-bold text-blue-700 flex items-center gap-2">
  <svg
    class="w-7 h-7 text-blue-500"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    viewBox="0 0 24 24"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M3 13l2-2m0 0l7-7 7 7M5 11v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0h6"
    />
  </svg>
  Formulario de Ambulancias
</h2>

<div class="mb-6 flex gap-3">
  <button
    type="button"
    class="bg-blue-500 hover:bg-blue-600 transition-colors text-white px-4 py-2 rounded shadow flex items-center gap-1"
    [class.opacity-80]="modo === 'agregar'"
    (click)="modo = 'agregar'"
  >
    <svg
      class="w-4 h-4"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
    </svg>
    Agregar
  </button>
  <button
    type="button"
    class="bg-yellow-500 hover:bg-yellow-600 transition-colors text-white px-4 py-2 rounded shadow flex items-center gap-1"
    [class.opacity-80]="modo === 'editar'"
    (click)="modo = 'editar'"
  >
    <svg
      class="w-4 h-4"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15.232 5.232l3.536 3.536M9 13l6-6m2 2l-6 6m2 2l-6 6"
      />
    </svg>
    Editar
  </button>
  <button
    type="button"
    class="bg-red-500 hover:bg-red-600 transition-colors text-white px-4 py-2 rounded shadow flex items-center gap-1"
    [class.opacity-80]="modo === 'eliminar'"
    (click)="modo = 'eliminar'"
  >
    <svg
      class="w-4 h-4"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M6 18L18 6M6 6l12 12"
      />
    </svg>
    Eliminar
  </button>
</div>

<form
  [formGroup]="formulario"
  (ngSubmit)="ejecutarAccion()"
  class="bg-white p-6 rounded-lg shadow-md flex flex-col gap-4 max-w-xl mx-auto"
>
  <div class="flex gap-4">
    <input
      formControlName="modelo"
      placeholder="Modelo"
      class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
      required="modelo"
    />
    <input
      formControlName="placa"
      placeholder="Placa"
      class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
    />
  </div>
  <div class="flex gap-4">
    <input
      formControlName="tipo"
      placeholder="Tipo de Ambulancia"
      class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
    />
    <input
      formControlName="ipsId"
      placeholder="ID IPS"
      type="number"
      class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
    />
  </div>

  <button
    type="submit"
    class="self-end mt-2 bg-gradient-to-r from-blue-500 to-blue-700 hover:from-blue-600 hover:to-blue-800 text-white px-6 py-2 rounded shadow font-semibold transition-all"
  >
    {{
      modo === "agregar" ? "Agregar" : modo === "editar" ? "Editar" : "Eliminar"
    }}
  </button>
</form>

<hr class="my-8 border-blue-200" />

<h3 class="my-4 text-xl font-semibold text-blue-600 flex items-center gap-2">
  <svg
    class="w-6 h-6 text-blue-400"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    viewBox="0 0 24 24"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M3 7h18M3 12h18M3 17h18"
    />
  </svg>
  Listado de Ambulancias
</h3>

<div class="overflow-auto max-h-96 border bg-secondary rounded-lg shadow">
  <table class="w-full text-left">
    <thead class="bg-blue-100 text-blue-700">
      <tr>
        <th class="py-2 px-4">Modelo</th>
        <th class="py-2 px-4">Placa</th>
        <th class="py-2 px-4">Tipo</th>
        <th class="py-2 px-4">ID IPS</th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let amb of ambulancias"
        (click)="seleccionarAmbulancia(amb)"
        class="hover:bg-blue-50 cursor-pointer transition-colors"
      >
        <td class="py-2 px-4">{{ amb.modelo }}</td>
        <td class="py-2 px-4">{{ amb.placa }}</td>
        <td class="py-2 px-4">{{ amb.tipo }}</td>
        <td class="py-2 px-4">{{ amb.ipsId }}</td>
      </tr>
    </tbody>
  </table>
</div>
