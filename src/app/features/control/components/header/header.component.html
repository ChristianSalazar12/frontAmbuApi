<header class="flex items-center justify-between bg-gray-500 h-14">
  <!-- Título a la izquierda -->
  <h1
    class="text-white text-lg font-bold w-52 bg-slate-600 h-full flex items-center justify-center"
  >
    Your Title
  </h1>

  <!-- Usuario y Logout a la derecha -->
  <div class="flex items-center space-x-4 pr-4">
    <span class="text-white font-medium">Christian Salazar</span>
    <img
      src="assets/user-logo.png"
      alt="User Logo"
      class="w-8 h-8 rounded-full object-cover"
    />

    <!-- Botón de salir -->
    <button
      class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700 transition"
      (click)="logout()"
    >
      Salir
    </button>
  </div>
</header>
